<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Воздушные шары</title>
<style>
:root{
  --lime:#84CC16; --lime-d:#65A30D; --lime-l:#ECFCCB;
  --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9;
  --ok:#22C55E; --ok-d:#16A34A; --bad:#EF4444; --bad-d:#DC2626;
  --bh:clamp(120px, 24vh, 230px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:#E0F2FE;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
input,textarea{font-family:inherit;user-select:text}
.hidden{display:none!important}
.screen{position:fixed;inset:0}

/* ---------- SETUP ---------- */
#setup{overflow:auto;background:linear-gradient(180deg,#BAE6FD 0%,#E0F2FE 60%,#F7FEE7 100%)}
.setup-wrap{max-width:1180px;margin:0 auto;padding:24px 20px 40px}
.s-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.s-head .logo{width:64px;height:78px;flex:none}
.s-head h1{font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1}
.s-head p{font-size:18px;color:var(--muted);font-weight:600;margin-top:4px}
.spacer{flex:1}
.langs{display:flex;background:#fff;border-radius:16px;padding:5px;gap:4px}
.langs button{height:48px;padding:0 18px;border-radius:12px;background:transparent;font-size:18px;font-weight:700;color:var(--muted)}
.langs button.on{background:var(--lime);color:#fff}
.icon-btn{width:54px;height:54px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:26px;height:26px}
.s-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
.card{background:#fff;border-radius:24px;padding:24px}
.card h2{font-size:24px;font-weight:800;margin-bottom:12px}
.card h2:not(:first-child){margin-top:24px}
.lbl{display:block;font-size:16px;font-weight:700;color:var(--muted);margin-bottom:8px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;height:58px;border-radius:14px;background:var(--soft);font-size:24px;font-weight:800;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.team-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.team-row i{width:28px;height:28px;border-radius:50%;flex:none}
.inp{width:100%;height:56px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font-size:20px;font-weight:600;outline:none;background:#fff;color:var(--ink)}
.inp:focus,textarea:focus{border-color:var(--lime)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row+.row,.stepper+.row{margin-top:14px}
.row span.t{font-size:18px;font-weight:600}
.switch{position:relative;width:64px;height:36px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD5E1;border-radius:999px;transition:.2s}
.switch span::after{content:'';position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--lime)}
.switch input:checked+span::after{transform:translateX(28px)}
.stepper{display:flex;align-items:center;gap:12px;margin-top:14px}
.stepper button{width:58px;height:58px;border-radius:14px;background:var(--soft);font-size:30px;font-weight:700;color:var(--ink)}
.stepper .val{font-size:30px;font-weight:900;min-width:60px;text-align:center}
.stepper.off{opacity:.35;pointer-events:none}
.pill{background:var(--lime-l);color:var(--lime-d);font-weight:800;font-size:16px;padding:6px 14px;border-radius:999px}
.hint{font-size:15px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.hint code{background:var(--soft);padding:1px 6px;border-radius:6px;color:var(--ink);font-size:14px}
textarea{width:100%;min-height:300px;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:16px;line-height:1.55;outline:none;resize:vertical;white-space:pre;overflow:auto;color:var(--ink)}
.btn{height:52px;padding:0 20px;border-radius:14px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:disabled{opacity:.5}
.btn.primary{background:var(--lime);color:#fff}
.btn.big{height:76px;font-size:28px;font-weight:900;border-radius:20px;width:100%;margin-top:20px}
.btn.primary:active,.btn.big:active{transform:scale(.99)}
.gem{margin-top:16px;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.gem summary{list-style:none;cursor:pointer;padding:16px 18px;font-size:18px;font-weight:800;background:var(--soft)}
.gem summary::-webkit-details-marker{display:none}
.gem-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.gem-body .row{flex-wrap:nowrap}
.err{color:var(--bad-d);font-weight:700;font-size:18px;margin-top:14px;min-height:1px}
.st-ok{color:var(--lime-d);font-weight:700}
.st-err{color:var(--bad-d);font-weight:700}

/* ---------- GAME ---------- */
#game{display:flex;flex-direction:column;background:#fff}
.topbar{height:68px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff}
.tb-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;letter-spacing:-.01em}
.tb-title svg{width:30px;height:36px}
.topbar .icon-btn{background:var(--soft)}
.sky{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(180deg,#38BDF8 0%,#7DD3FC 45%,#E0F2FE 100%)}
.sun{position:absolute;right:6%;top:9%;width:90px;height:90px;border-radius:50%;background:#FDE047;box-shadow:0 0 0 18px rgba(253,224,71,.25)}
.cloud{position:absolute;left:0;height:calc(var(--w)*.34);width:var(--w);background:#fff;border-radius:999px;opacity:.92;animation:drift var(--d) linear infinite;animation-delay:var(--dl);z-index:1}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:48%;height:150%;left:14%;bottom:25%}
.cloud::after{width:34%;height:115%;left:50%;bottom:30%}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(115vw)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--lime-d);border-top:6px solid var(--lime);z-index:2}
.track{position:absolute;left:78px;right:24px;bottom:46px;top:calc(var(--bh) + 10px);z-index:2}
.mark{position:absolute;left:-70px;right:0;height:0;border-top:2px dashed rgba(255,255,255,.65)}
.mark span{position:absolute;left:0;top:0;transform:translateY(-50%);width:46px;height:24px;line-height:24px;text-align:center;background:rgba(255,255,255,.92);color:#0369A1;font-weight:900;font-size:16px;border-radius:8px}
.mark.top{border-top:5px solid var(--lime)}
.mark.top span{background:var(--lime);color:#fff;width:auto;padding:0 10px;height:30px;line-height:30px}
.mark.zero{border:none}
.balloon{position:absolute;bottom:30%;width:calc(var(--bh) * .632);height:var(--bh);transform:translateX(-50%);transition:bottom 1.1s cubic-bezier(.34,1.25,.5,1);z-index:3}
.sway{width:100%;height:100%;position:relative;animation:sway 4.2s ease-in-out infinite;transform-origin:50% 25%}
@keyframes sway{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-7px)}}
.bsvg{width:100%;height:100%;display:block;overflow:visible;transition:filter .3s,opacity .3s}
.flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.55);transition:transform .25s}
.balloon.burn .flame{animation:flick .12s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1.8,2.1)}to{transform:scale(2.1,2.6)}}
.tag{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;color:#fff;font-weight:800;font-size:clamp(14px,1.55vw,22px);padding:4px 14px;border-radius:999px;white-space:nowrap;max-width:24vw;overflow:hidden;text-overflow:ellipsis;transition:transform .25s,box-shadow .25s}
.balloon.active .bsvg{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 16px rgba(132,204,22,1))}
.balloon.active .tag{box-shadow:0 0 0 4px var(--lime),0 0 0 7px #fff;transform:translateX(-50%) scale(1.1)}
.balloon.out .sway{animation:none}
.balloon.out .bsvg{filter:grayscale(1);opacity:.65}
.balloon.out .tag{background:#94A3B8!important}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);background:#fff;padding:18px 32px;border-radius:20px;font-size:clamp(24px,2.6vw,38px);font-weight:900;opacity:0;pointer-events:none;transition:.3s;z-index:5;text-align:center;max-width:80%}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.qbar{flex:none;display:flex;align-items:center;gap:18px;padding:12px 20px 10px;background:#fff;border-top:6px solid var(--lime)}
.qb-main{flex:1;min-width:0}
.qnum{display:inline-block;background:var(--lime-l);color:var(--lime-d);font-weight:800;font-size:18px;padding:4px 14px;border-radius:999px;margin-bottom:6px}
.qtext{font-size:clamp(34px,3.1vw,54px);font-weight:900;line-height:1.15;overflow-wrap:break-word;user-select:text}
.qtext.long{font-size:clamp(28px,2.3vw,40px)}
.qb-side{flex:none;display:flex;align-items:center}
.timer{position:relative;width:104px;height:104px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:11}
.timer .bg{stroke:var(--soft)}
.timer .fg{stroke:var(--lime);stroke-linecap:round;transition:stroke .3s}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:900}
.timer.warn .fg{stroke:var(--bad)} .timer.warn .num{color:var(--bad)}
.next{height:96px;padding:0 36px;border-radius:26px;background:var(--lime);color:#fff;font-size:34px;font-weight:900;box-shadow:0 6px 0 var(--lime-d);animation:pulse 1.3s ease-in-out infinite}
.next:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lime-d)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.panel{flex:none;display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px;padding:0 12px 12px;background:#fff}
.tp{position:relative;border:5px solid var(--c);border-radius:26px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;background:#fff;min-width:0;overflow:hidden;transition:background .3s}
.tp.good{background:#ECFDF5} .tp.miss{background:#FFF7ED}
.tp-head{display:flex;align-items:center;gap:10px;min-height:46px}
.tp-name{background:var(--c);color:#fff;font-weight:900;font-size:clamp(18px,1.5vw,26px);padding:5px 16px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.tp-fb{flex:1;min-width:0;font-size:clamp(18px,1.5vw,26px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-fb.ok{color:var(--ok-d)} .tp-fb.no{color:#EA580C}
.tp-score{font-size:clamp(18px,1.5vw,26px);font-weight:900;color:#CA8A04;white-space:nowrap}
.tp-opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opt{min-width:0;display:flex;align-items:center;gap:12px;min-height:84px;padding:8px 12px;border:4px solid var(--line);border-radius:20px;background:#F8FAFC;font-size:clamp(22px,2vw,34px);font-weight:800;text-align:left;color:var(--ink);touch-action:none;overflow-wrap:break-word;box-shadow:0 5px 0 var(--line);transition:background .2s,border-color .2s,opacity .2s,transform .1s}
.opt span{min-width:0}
.opt b{width:50px;height:50px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font-size:26px}
.opt:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--line);border-color:var(--c)}
.opt.ok{background:var(--ok);border-color:var(--ok-d);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.opt.ok b{background:#fff;color:var(--ok-d)}
.opt.bad{background:var(--bad);border-color:var(--bad-d);color:#fff;box-shadow:0 5px 0 var(--bad-d)}
.opt.bad b{background:#fff;color:var(--bad-d)}
.opt.dim{opacity:.35}
.panel.n3 .opt{font-size:clamp(19px,1.5vw,27px);min-height:76px}
.panel.n4 .tp-opts{gap:7px}
.panel.n4 .opt{font-size:clamp(17px,1.3vw,25px);min-height:64px;padding:5px 8px;gap:8px}
.panel.n4 .opt b{width:38px;height:38px;font-size:20px}
.tp-lock{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff;color:var(--c);text-align:center;padding:10px}
.tp.locked .tp-lock{display:flex}
.lk-ic{font-size:clamp(48px,4vw,72px);animation:pulse 1.2s ease-in-out infinite}
.lk-t{font-size:clamp(26px,2.2vw,38px);font-weight:900}
.lk-s{font-size:clamp(16px,1.2vw,21px);font-weight:700;color:var(--muted)}

/* ---------- WIN ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.win-card{position:relative;background:#fff;border-radius:30px;padding:28px 32px 30px;width:min(760px,96vw);max-height:94vh;overflow:auto;text-align:center;animation:pop .5s cubic-bezier(.34,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.win-b .bsvg{width:110px;height:170px}
.win-b{display:flex;justify-content:center;gap:18px;height:170px;margin:0 auto;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.win-lbl{font-size:20px;font-weight:800;color:var(--lime-d);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.win-card h2{font-size:clamp(34px,4.5vw,56px);font-weight:900;line-height:1.1;margin:4px 0}
.win-card p{font-size:22px;font-weight:600;color:var(--muted)}
.win-card h3{font-size:22px;font-weight:800;margin:20px 0 8px;text-align:left}
table{width:100%;border-collapse:collapse;font-size:22px}
th{font-size:16px;color:var(--muted);font-weight:700;text-align:center;padding:8px}
th:first-child,td:first-child{text-align:left}
td{padding:12px 8px;border-top:2px solid var(--soft);font-weight:700;text-align:center}
td i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:10px;vertical-align:-2px}
tr.w td{background:var(--lime-l)}
td.c{color:var(--ok-d)} td.x{color:var(--bad-d)}
.win-btns{display:flex;gap:12px;margin-top:22px}
.win-btns .btn{flex:1;height:72px;font-size:24px;font-weight:900;border-radius:20px}

@media (max-height:820px){
  .topbar{height:56px}
  .qbar{padding:8px 16px 6px}
  .qnum{font-size:15px;padding:2px 12px;margin-bottom:2px}
  .qtext{font-size:clamp(26px,2.6vw,40px)}
  .timer{width:80px;height:80px} .timer .num{font-size:30px}
  .next{height:72px;font-size:28px;padding:0 26px}
  .tp{padding:6px 10px 10px;gap:6px}
  .tp-head{min-height:36px}
  .opt{min-height:60px;font-size:clamp(20px,1.8vw,28px)}
  .opt b{width:42px;height:42px;font-size:22px}
  .panel.n4 .opt{min-height:44px}
  .panel.n4 .opt b{width:32px;height:32px;font-size:17px}
}
@media (max-width:860px){
  .s-grid{grid-template-columns:1fr}
  .panel{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setup" class="screen">
  <div class="setup-wrap">
    <header class="s-head">
      <div class="logo" id="logoBalloon"></div>
      <div>
        <h1 data-i18n="title"></h1>
        <p data-i18n="subtitle"></p>
      </div>
      <div class="spacer"></div>
      <div class="langs" id="langs">
        <button data-lang="kk">Қазақша</button>
        <button data-lang="ru">Русский</button>
        <button data-lang="uz">Ўзбекча</button>
      </div>
      <button class="icon-btn fs-btn" aria-label="Fullscreen"></button>
    </header>

    <div class="s-grid">
      <div class="card">
        <h2 data-i18n="teams"></h2>
        <label class="lbl" data-i18n="teamCount"></label>
        <div class="seg" id="countSeg">
          <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
        </div>
        <div id="teamInputs"></div>

        <h2 data-i18n="timer"></h2>
        <div class="row">
          <label class="switch"><input type="checkbox" id="timerOn"><span></span></label>
          <span class="t" data-i18n="timerOn"></span>
        </div>
        <div class="stepper" id="secStep">
          <button id="secMinus">−</button>
          <span class="val" id="secVal">30</span>
          <span class="t" data-i18n="sec"></span>
          <button id="secPlus">+</button>
        </div>
        <div class="row">
          <label class="switch"><input type="checkbox" id="shuffleOn"><span></span></label>
          <span class="t" data-i18n="shuffle"></span>
        </div>
      </div>

      <div class="card">
        <div class="row between">
          <h2 data-i18n="questions" style="margin:0"></h2>
          <span class="pill" id="qCount"></span>
        </div>
        <p class="hint" style="margin-top:10px" id="qHint"></p>
        <textarea id="qInput" spellcheck="false"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost" id="sampleBtn" data-i18n="sample"></button>
          <button class="btn ghost" id="clearBtn" data-i18n="clear"></button>
        </div>

        <details class="gem" id="gemBox">
          <summary>✨ <span data-i18n="gemini"></span></summary>
          <div class="gem-body">
            <input class="inp" id="gKey" type="password" autocomplete="off" data-i18n-ph="apiKey">
            <input class="inp" id="gTopic" data-i18n-ph="topic">
            <div class="row">
              <input class="inp" id="gModel" style="flex:1" value="gemini-2.5-flash">
              <input class="inp" id="gCount" type="number" min="3" max="30" value="10" style="width:96px">
              <button class="btn dark" id="gBtn" style="height:56px" data-i18n="generate"></button>
            </div>
            <p class="hint" id="gStatus" style="margin:0"></p>
            <p class="hint" data-i18n="keyNote" style="margin:0"></p>
          </div>
        </details>
      </div>
    </div>

    <div class="err" id="setupErr"></div>
    <button class="btn primary big" id="startBtn">▶&nbsp;<span data-i18n="start"></span></button>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen hidden">
  <div class="topbar">
    <div class="tb-title"><span id="tbLogo"></span><span data-i18n="title"></span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="sndBtn" aria-label="Sound"></button>
    <button class="icon-btn fs-btn" aria-label="Fullscreen"></button>
    <button class="icon-btn" id="setBtn" aria-label="Settings"></button>
  </div>

  <div class="sky" id="sky">
    <div class="sun"></div>
    <div id="clouds"></div>
    <div class="track" id="track"></div>
    <div class="ground"></div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="qbar">
    <div class="qb-main">
      <span class="qnum hidden" id="qnum"></span>
      <div class="qtext" id="qtext"></div>
    </div>
    <div class="qb-side">
      <div class="timer hidden" id="timer">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="ring" cx="50" cy="50" r="42"/></svg>
        <div class="num" id="tnum">30</div>
      </div>
      <button class="next hidden" id="nextBtn"></button>
    </div>
  </div>
  <div class="panel" id="panel"></div>
</section>

<!-- ============ WIN ============ -->
<div class="overlay hidden" id="win">
  <canvas id="confetti"></canvas>
  <div class="win-card">
    <div class="win-b" id="winBalloon"></div>
    <div class="win-lbl" data-i18n="winner"></div>
    <h2 id="winName"></h2>
    <p id="winReason"></p>
    <h3 data-i18n="stats"></h3>
    <table id="statTable"></table>
    <div class="win-btns">
      <button class="btn primary" id="againBtn">↻&nbsp;<span data-i18n="again"></span></button>
      <button class="btn ghost" id="toSetupBtn">⚙&nbsp;<span data-i18n="settings"></span></button>
    </div>
  </div>
</div>

<script>

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const tgt = amt<0?0:255, a=Math.abs(amt);
  r=Math.round(r+(tgt-r)*a); g=Math.round(g+(tgt-g)*a); b=Math.round(b+(tgt-b)*a);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

/* ---------- ЗВУКИ (Web Audio API) ---------- */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f, at, dur, type, vol, fEnd){
  const a=ac(); if(!a||S.muted) return;
  const t0=a.currentTime+at, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(fEnd) o.frequency.exponentialRampToValueAtTime(fEnd,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.2,t0+.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.05);
}
function noise(at, dur, vol, freq){
  const a=ac(); if(!a||S.muted) return;
  const t0=a.currentTime+at, len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=buf; f.type='lowpass'; f.frequency.value=freq||900;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.3,t0+.05); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t0);
}

function setLang(l){
  const old = S.lang;
  for(let i=0;i<4;i++) if(!S.names[i] || S.names[i]===DEF_NAMES[old][i]) S.names[i]=DEF_NAMES[l][i];
  const cur = qInput.value.trim();
  if(!cur || cur===SAMPLES[old].trim()) qInput.value = SAMPLES[l];
  S.lang = l; S.qtext = qInput.value;
  renderTeamInputs(); applyLang(); save();
}
function renderTeamInputs(){
  const box = $('#teamInputs'); box.innerHTML='';
  for(let i=0;i<4;i++){
    const row = document.createElement('div'); row.className='team-row'+(i>=S.n?' hidden':'');
    const dot = document.createElement('i'); dot.style.background = COLORS[i];
    const inp = document.createElement('input'); inp.className='inp'; inp.maxLength=24; inp.value = S.names[i]||'';
    inp.oninput = ()=>{ S.names[i]=inp.value; save(); };
    row.append(dot, inp); box.append(row);
  }
  $$('#countSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.n===S.n));
}
function renderTimer(){
  $('#timerOn').checked = S.timerOn; $('#secVal').textContent = S.secs;
  $('#secStep').classList.toggle('off', !S.timerOn);
  $('#shuffleOn').checked = S.shuffle;
}
function parseQ(text){
  const qs=[], errs=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    const line = raw.trim(); if(!line || line.startsWith('#')) return;
    const p = line.split('|').map(s=>s.trim());
    if(p.length===1){ errs.push(i+1); return; }
    const num = parseInt(p[p.length-1],10), opts = p.slice(1,-1);
    if(!p[0] || opts.length<2 || opts.length>4 || opts.some(o=>!o) || isNaN(num) || num<1 || num>opts.length){ errs.push(i+1); return; }
    qs.push({text:p[0], opts, correct:num-1});
  });
  return {qs, errs};
}
function updateQCount(){
  const r = parseQ(qInput.value);
  $('#qCount').textContent = t('loaded',{n:r.qs.length});
  $('#setupErr').textContent = r.errs.length ? t('badLine',{n:r.errs.slice(0,8).join(', ')+(r.errs.length>8?'…':'')}) : '';
  return r;
}

$('#secMinus').onclick = ()=>{ S.secs=Math.max(5,S.secs-5); renderTimer(); save(); };

qInput.oninput = ()=>{ S.qtext=qInput.value; updateQCount(); save(); };
$('#sampleBtn').onclick = ()=>{ qInput.value=SAMPLES[S.lang]; S.qtext=qInput.value; updateQCount(); save(); };
$('#clearBtn').onclick = ()=>{ qInput.value=''; S.qtext=''; updateQCount(); save(); qInput.focus(); };

gKey.oninput=()=>{S.key=gKey.value.trim();save();}; gTopic.oninput=()=>{S.topic=gTopic.value;save();}; gModel.oninput=()=>{S.model=gModel.value.trim();save();};
function gSay(msg, cls){ gStatus.textContent=msg; gStatus.className='hint '+(cls||''); }
$('#gBtn').onclick = async ()=>{
  const key=gKey.value.trim(), topic=gTopic.value.trim(), model=gModel.value.trim()||'gemini-2.5-flash';
  const count=Math.max(3,Math.min(30,parseInt(gCount.value,10)||10));
  if(!key||!topic){ gSay(t('needKey'),'st-err'); return; }
  const LN = {ru:'Russian', kk:'Kazakh (Cyrillic script)', uz:'Uzbek (Cyrillic script)'}[S.lang];
  const prompt = `Create ${count} multiple-choice quiz questions for a school lesson.
Topic (subject, grade, lesson theme): ${topic}
Language of questions and answer options: ${LN}.
Output ONLY the questions, one per line, no numbering, no headings, no markdown, no blank lines, in exactly this format:
Question | option A | option B | option C | option D | N
where N is the number (1-4) of the correct option.
Rules: exactly 4 options; never use the "|" character inside a question or option; keep options short (max ~8 words); vary the position of the correct answer; questions must be factually correct and suitable for the stated grade.`;
  const btn=$('#gBtn'); btn.disabled=true; btn.textContent=t('generating'); gSay(t('generating'));
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}], generationConfig:{temperature:0.8}})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error((data.error&&data.error.message)||('HTTP '+res.status));
    const txt = ((data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[]).map(p=>p.text||'').join('\n');
    const good = txt.split(/\r?\n/)
      .map(l=>l.replace(/^[\s>*`\-•]+/,'').replace(/^\d{1,2}[.)]\s+/,'').replace(/`+$/,'').trim())
      .filter(l=>{ if(!l.includes('|')) return false; const r=parseQ(l); return r.qs.length===1 && r.qs[0].opts; });
    if(!good.length) throw new Error('empty response');
    qInput.value = good.join('\n'); S.qtext=qInput.value; save(); updateQCount();
    gSay(t('genOk',{n:good.length}),'st-ok');
  }catch(e){ gSay(t('genErr')+e.message,'st-err'); }
  finally{ btn.disabled=false; btn.textContent=t('generate'); }
};

/* ---------- ПОЛНЫЙ ЭКРАН И ЗВУК ---------- */
function fsIcon(){ const on=!!document.fullscreenElement; $$('.fs-btn').forEach(b=>b.innerHTML=on?ICON.fsOut:ICON.fsIn); }
$$('.fs-btn').forEach(b=>b.onclick=()=>{
  if(document.fullscreenElement) { try{ const r=document.exitFullscreen&&document.exitFullscreen(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
  else { const el=document.documentElement; try{ const r=(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
});
document.addEventListener('fullscreenchange', fsIcon);
function sndIcon(){ $('#sndBtn').innerHTML = S.muted?ICON.mute:ICON.snd; }
$('#sndBtn').onclick = ()=>{ S.muted=!S.muted; sndIcon(); save(); if(!S.muted) tone(880,0,.1,'triangle',.15); };
$('#setBtn').innerHTML = ICON.gear;
let exitArm=0;
$('#setBtn').onclick = ()=>{
  if(G && !G.over && Date.now()-exitArm>3000){ exitArm=Date.now(); toast(t('exitTap'),2500); return; }
  exitArm=0; toSetup();
};

/* ---------- ИГРА: общий вопрос, каждая команда отвечает сама ---------- */
let G = null, lastQs = [];
const RING_C = 2*Math.PI*42;
$('#ring').style.strokeDasharray = RING_C;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildClouds(){
  const box=$('#clouds'); box.innerHTML='';
  const cfg=[[190,62,6],[130,48,22],[240,80,40],[110,40,58],[170,70,14],[150,55,32]];
  cfg.forEach(([w,d,top])=>{
    const c=document.createElement('div'); c.className='cloud';
    c.style.setProperty('--w',w+'px'); c.style.setProperty('--d',d+'s');
    c.style.setProperty('--dl',(-Math.random()*d).toFixed(1)+'s');
    c.style.top = top+'%'; c.style.opacity = (0.7+Math.random()*.25).toFixed(2);
    box.append(c);
  });
}

function startGame(){
  clearTimer();
  const names = S.names.slice(0,S.n), order = lastQs.map((_,i)=>i);
  if(S.shuffle) shuffle(order);
  G = {
    teams: names.map((nm,i)=>({name:(nm||'').trim()||('#'+(i+1)), color:COLORS[i], level:3, correct:0, wrong:0, map:[], pick:null, el:null})),
    qs: lastQs, order, qi:0, q:null, phase:'start', over:false, tInt:null, tEnd:0
  };
  const g = G;
  $('#setup').classList.add('hidden'); $('#win').classList.add('hidden'); $('#game').classList.remove('hidden');
  stopConfetti();
  $('#qtext').textContent=''; $('#qnum').classList.add('hidden');
  $('#nextBtn').classList.add('hidden'); $('#timer').classList.add('hidden');
  buildPanels(); sizeSky(); buildSky();
  G.teams.forEach((tm,i)=>{ const el=$('#b'+i); el.style.transition='none'; el.style.bottom='0%'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(G!==g) return;
    G.teams.forEach((tm,i)=>{ $('#b'+i).style.transition=''; burn(i); });
    posBalloons();
  }));
  ['3','2','1',t('go')].forEach((txt,k)=>setTimeout(()=>{
    if(G!==g) return;
    toast(txt, 700);
    if(k<3) tone(660,0,.15,'square',.08); else tone(990,0,.3,'square',.1);
    if(k===3) showQuestion();
  }, 300+k*800));
}

function buildPanels(){
  const p=$('#panel'); p.innerHTML='';
  const n=G.teams.length;
  p.style.setProperty('--n', n);
  ['n2','n3','n4'].forEach(c=>p.classList.toggle(c, c==='n'+n));
  G.teams.forEach((tm,i)=>{
    const d=document.createElement('div'); d.className='tp'; d.style.setProperty('--c',tm.color);
    d.innerHTML='<div class="tp-head"><span class="tp-name"></span><span class="tp-fb"></span><span class="tp-score"></span></div>'+
      '<div class="tp-opts"></div>'+
      '<div class="tp-lock"><div class="lk-ic">🔒</div><div class="lk-t"></div><div class="lk-s"></div></div>';
    const q=s=>d.querySelector(s);
    q('.tp-name').textContent='🎈 '+tm.name;
    q('.lk-t').textContent=t('locked'); q('.lk-s').textContent=t('wait');
    tm.el={root:d, fb:q('.tp-fb'), opts:q('.tp-opts'), score:q('.tp-score')};
    tm.el.score.textContent='⭐ 0';
    p.append(d);
  });
}

function showQuestion(){
  if(!G || G.over) return;
  const len=G.qs.length;
  if(G.qi>0 && G.qi%len===0 && S.shuffle) shuffle(G.order);
  const q=G.qs[G.order[G.qi%len]]; G.q=q; G.qi++;
  const qn=$('#qnum'); qn.textContent=t('q')+' '+G.qi; qn.classList.remove('hidden');
  const qt=$('#qtext'); qt.textContent=q.text; qt.classList.toggle('long', q.text.length>80);
  $('#nextBtn').classList.add('hidden');
  G.teams.forEach((tm,i)=>{
    const el=tm.el; tm.pick=null;
    el.root.classList.remove('good','miss','locked');
    el.fb.textContent=''; el.fb.className='tp-fb';
    el.opts.innerHTML='';
    // у каждой команды свой порядок вариантов — нельзя подсмотреть у соседей
    tm.map=shuffle(q.opts.map((_,k)=>k));
    tm.map.forEach((oi,k)=>{
      const b=document.createElement('button'); b.className='opt';
      const L=document.createElement('b'); L.textContent=LETTERS[k];
      const sp=document.createElement('span'); sp.textContent=q.opts[oi];
      b.append(L,sp);
      b.addEventListener('pointerdown',e=>{ e.preventDefault(); pick(i,k); });
      el.opts.append(b);
    });
  });
  G.phase='ask';
  const tmr=$('#timer');
  if(S.timerOn){
    tmr.classList.remove('hidden','warn');
    G.tEnd=Date.now()+S.secs*1000; lastSec=null;
    G.tInt=setInterval(tick,100); tick();
  } else tmr.classList.add('hidden');
}

function pick(i,k){
  if(!G || G.phase!=='ask') return;
  const tm=G.teams[i]; if(tm.pick!==null) return;
  tm.pick=k; ac();
  tone(700,0,.08,'triangle',.15); tone(1050,.07,.12,'triangle',.15);
  tm.el.root.classList.add('locked');
  Array.from(tm.el.opts.children).forEach(b=>b.disabled=true);
  if(G.teams.every(x=>x.pick!==null)){ const g=G; setTimeout(()=>{ if(G===g) reveal(); },500); }
}

let lastSec=null;
function tick(){
  if(!G || G.phase!=='ask') return;
  const rem=Math.max(0,(G.tEnd-Date.now())/1000), sec=Math.ceil(rem);
  $('#tnum').textContent=sec;
  $('#ring').style.strokeDashoffset=RING_C*(1-rem/S.secs);
  $('#timer').classList.toggle('warn', rem<=5);
  if(sec!==lastSec && sec<=5 && sec>0) SFX.tick();
  lastSec=sec;
  if(rem<=0) reveal();
}
function clearTimer(){ if(G&&G.tInt){ clearInterval(G.tInt); G.tInt=null; } }

function reveal(){
  if(!G || G.phase!=='ask') return;
  G.phase='reveal'; clearTimer();
  let anyOk=false; const short=G.teams.length>=3;
  G.teams.forEach((tm,i)=>{
    const el=tm.el; el.root.classList.remove('locked');
    Array.from(el.opts.children).forEach((b,j)=>{
      b.disabled=true;
      if(tm.map[j]===G.q.correct) b.classList.add('ok'); else if(j===tm.pick) b.classList.add('bad'); else b.classList.add('dim');
    });
    const ok = tm.pick!==null && tm.map[tm.pick]===G.q.correct;
    if(ok){
      tm.correct++; tm.level=Math.min(10,tm.level+1); burn(i); anyOk=true;
      el.fb.textContent=short?'⭐ +1':t('good'); el.fb.className='tp-fb ok'; el.root.classList.add('good');
    } else {
      // без штрафа: шар остаётся на месте
      if(tm.pick!==null) tm.wrong++;
      el.fb.textContent = short ? (tm.pick===null?'⏰':'🙂') : (tm.pick===null ? t('timeUp') : t('miss')); el.fb.className='tp-fb no'; el.root.classList.add('miss');
    }
    el.score.textContent='⭐ '+tm.correct;
  });
  posBalloons();
  if(anyOk) SFX.correct(); else SFX.wrong();
  $('#timer').classList.add('hidden');
  const winners=G.teams.filter(x=>x.level>=10);
  if(winners.length){ G.over=true; const g=G; setTimeout(()=>{ if(G===g) showWin(winners); },1500); return; }
  $('#nextBtn').classList.remove('hidden');
}
function next(){ if(G && !G.over && G.phase==='reveal') showQuestion(); }
$('#nextBtn').onclick = next;
document.addEventListener('keydown',e=>{
  if(!G || $('#game').classList.contains('hidden')) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if((e.key==='Enter'||e.key===' '||e.key==='ArrowRight') && G.phase==='reveal'){ e.preventDefault(); next(); }
});

function buildSky(){
  const tr=$('#track'); tr.innerHTML='';
  for(let L=0;L<=10;L++){
    const m=document.createElement('div'); m.className='mark'+(L===10?' top':'')+(L===0?' zero':'');
    m.style.bottom=(L*10)+'%';
    const s=document.createElement('span'); s.textContent = L===10?t('finish'):L; m.append(s);
    tr.append(m);
  }
  const n=G.teams.length;
  G.teams.forEach((tm,i)=>{
    const b=document.createElement('div'); b.className='balloon'; b.id='b'+i;
    b.style.left=((i+.5)/n*100)+'%';
    const sw=document.createElement('div'); sw.className='sway'; sw.style.animationDelay=(-i*1.1)+'s';
    sw.innerHTML=balloonSVG(tm.color);
    const tag=document.createElement('div'); tag.className='tag'; tag.style.background=tm.color; tag.textContent=tm.name;
    sw.append(tag); b.append(sw); tr.append(b);
  });
}
function sizeSky(){
  const h=$('#sky').clientHeight; if(!h) return;
  document.documentElement.style.setProperty('--bh', Math.round(Math.max(70,Math.min(210,h*0.3)))+'px');
}
window.addEventListener('resize', sizeSky);
if(window.ResizeObserver) new ResizeObserver(sizeSky).observe($('#sky'));
function posBalloons(){
  G.teams.forEach((tm,i)=>{ const el=$('#b'+i); if(el) el.style.bottom=(Math.max(0,Math.min(10,tm.level))*10)+'%'; });
}
function burn(i){ const el=$('#b'+i); if(!el) return; el.classList.add('burn'); clearTimeout(el._bt); el._bt=setTimeout(()=>el.classList.remove('burn'),1200); }

let toastT;
function toast(msg, ms){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),ms||2300); }

/* ---------- ПОБЕДА ---------- */
function showWin(ws){
  clearTimer(); posBalloons();
  const tie=ws.length>1;
  $('#winBalloon').innerHTML=ws.map(w=>balloonSVG(w.color)).join('');
  $('.win-lbl').textContent=t(tie?'winners':'winner');
  const wn=$('#winName'); wn.textContent=ws.map(w=>w.name).join(' + '); wn.style.color=tie?'var(--ink)':ws[0].color;
  $('#winReason').textContent=t(tie?'winTie':'winTop');
  const tb=$('#statTable'); tb.innerHTML='';
  const hr=document.createElement('tr');
  [t('team'),t('right'),t('mistakes'),t('level')].forEach(h=>{ const th=document.createElement('th'); th.textContent=h; hr.append(th); });
  tb.append(hr);
  G.teams.slice().sort((a,b)=>b.level-a.level||b.correct-a.correct).forEach(x=>{
    const tr=document.createElement('tr'); if(ws.includes(x)) tr.className='w';
    const c1=document.createElement('td'); const dot=document.createElement('i'); dot.style.background=x.color; c1.append(dot, document.createTextNode(x.name));
    const c2=document.createElement('td'); c2.className='c'; c2.textContent=x.correct;
    const c3=document.createElement('td'); c3.className='x'; c3.textContent=x.wrong;
    const c4=document.createElement('td'); c4.textContent=x.level;
    tr.append(c1,c2,c3,c4); tb.append(tr);
  });
  $('#win').classList.remove('hidden');
  SFX.win(); startConfetti(ws[0].color);
}
$('#againBtn').onclick=()=>startGame();
$('#toSetupBtn').onclick=()=>toSetup();
function toSetup(){
  clearTimer(); stopConfetti(); G=null;
  $('#win').classList.add('hidden'); $('#game').classList.add('hidden'); $('#setup').classList.remove('hidden');
}

/* конфетти */
let CF={run:false,raf:0};
function startConfetti(main){
  const c=$('#confetti'), ctx=c.getContext('2d'), dpr=window.devicePixelRatio||1;
  const W=innerWidth, H=innerHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const pal=[main,main,'#84CC16','#FDE047','#38BDF8','#F472B6','#fff'];
  const mk=init=>({x:Math.random()*W, y:init?-Math.random()*H:-20, vx:(Math.random()-.5)*2.4, vy:2+Math.random()*3.5, r:Math.random()*6.3, vr:(Math.random()-.5)*.3, w:8+Math.random()*9, h:5+Math.random()*6, c:pal[Math.random()*pal.length|0]});
  const P=Array.from({length:220},()=>mk(true)), t0=performance.now();
  CF.run=true; cancelAnimationFrame(CF.raf);
  (function loop(now){
    if(!CF.run){ ctx.clearRect(0,0,W,H); return; }
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.x+=p.vx+Math.sin(now/500+p.r)*.7; p.y+=p.vy; p.r+=p.vr;
      if(p.y>H+20 && now-t0<9000) Object.assign(p,mk(false));
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    CF.raf=requestAnimationFrame(loop);
  })(t0);
}
function stopConfetti(){ CF.run=false; }

/* ---------- ИНИЦИАЛИЗАЦИЯ ---------- */
if(!I18N[S.lang]) S.lang='ru';
qInput.value = (S.qtext===null||S.qtext===undefined) ? SAMPLES[S.lang] : S.qtext;
$('#logoBalloon').innerHTML = balloonSVG('#84CC16');
$('#tbLogo').innerHTML = balloonSVG('#84CC16').replace('class="bsvg"','style="width:30px;height:46px"');
renderTeamInputs(); renderTimer(); applyLang(); fsIcon(); sndIcon(); buildClouds();
})();
</script>
