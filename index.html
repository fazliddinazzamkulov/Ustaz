<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зияткерлік ойын тақтасы — Apple Style</title>
    <style>
        :root {
            --bg-primary: #000000;
            --surface-glass: rgba(28, 28, 30, 0.65);
            --surface-glass-hover: rgba(44, 44, 46, 0.75);
            --surface-elevated: rgba(255, 255, 255, 0.07);
            --border-subtle: rgba(255, 255, 255, 0.12);
            --border-highlight: rgba(255, 255, 255, 0.22);
            --text-primary: #F5F5F7;
            --text-secondary: #86868B;
            
            /* Apple System Accents */
            --accent-amber: #FF9F0A;
            --accent-pink: #FF375F;
            --accent-blue: #0A84FF;
            --accent-green: #30D158;
            --accent-red: #FF453A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 159, 10, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(255, 55, 95, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 25%, rgba(10, 132, 255, 0.15) 0%, transparent 45%);
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 16:9 Canvas */
        .stage-16-9 {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            display: grid;
            grid-template-rows: 24% 76%;
            padding: 2.8vh 3.2vw;
            gap: 2.6vh;
            position: relative;
        }

        /* SVG Icon Utility */
        .icon-svg {
            width: 2.2vh;
            height: 2.2vh;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        /* TOP NAVIGATION & TIMER BAR */
        .top-bar {
            background: var(--surface-glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--border-subtle);
            border-radius: 2.8vh;
            display: grid;
            grid-template-columns: 32% 36% 32%;
            align-items: center;
            padding: 0 2.4vw;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Left: Time Presets & Custom */
        .time-Controls-group {
            display: flex;
            flex-direction: column;
            gap: 1.1vh;
        }

        .section-caption {
            font-size: 1.35vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5vw;
        }

        .segmented-presets {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.4vh;
            border-radius: 1.4vh;
            border: 1px solid rgba(255, 255, 255, 0.07);
            width: fit-content;
            gap: 0.2vw;
        }

        .preset-pill {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.7vh 1vw;
            border-radius: 1vh;
            font-size: 1.55vh;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .preset-pill:hover {
            color: var(--text-primary);
        }

        .preset-pill.active {
            background: rgba(255, 255, 255, 0.14);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .custom-time-row {
            display: flex;
            align-items: center;
            gap: 0.5vw;
        }

        .apple-input {
            width: 3.8vw;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            border-radius: 1vh;
            padding: 0.65vh 0.5vw;
            font-size: 1.55vh;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .apple-input:focus {
            border-color: var(--accent-blue);
        }

        .btn-glass-sm {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 0.65vh 1vw;
            border-radius: 1vh;
            font-size: 1.5vh;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-glass-sm:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Center: Master Clock */
        .timer-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-readout {
            font-size: 10.5vh;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--text-primary);
            transition: color 0.3s ease, transform 0.25s ease;
        }

        .timer-readout.warning {
            color: var(--accent-amber);
            text-shadow: 0 0 32px rgba(255, 159, 10, 0.35);
        }

        .timer-readout.danger {
            color: var(--accent-red);
            text-shadow: 0 0 40px rgba(255, 69, 58, 0.55);
            animation: applePulse 0.9s infinite ease-in-out;
        }

        @keyframes applePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.035); }
        }

        /* Right: Main Actions */
        .right-controls-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1.2vh;
        }

        .primary-transport {
            display: flex;
            align-items: center;
            gap: 0.7vw;
        }

        .btn-apple {
            border: 1px solid var(--border-subtle);
            background: var(--surface-elevated);
            color: var(--text-primary);
            padding: 1.2vh 1.4vw;
            border-radius: 1.6vh;
            font-size: 1.75vh;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5vw;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-apple:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .btn-apple:active {
            transform: scale(0.97);
        }

        .btn-icon-only {
            padding: 1.2vh;
            border-radius: 1.4vh;
        }

        .btn-play {
            background: var(--accent-green);
            color: #000000;
            border: none;
            padding: 1.2vh 1.8vw;
            box-shadow: 0 8px 20px rgba(48, 209, 88, 0.3);
        }

        .btn-play:hover {
            background: #40dd66;
            box-shadow: 0 10px 25px rgba(48, 209, 88, 0.45);
        }

        .btn-pause {
            background: var(--accent-amber);
            color: #000000;
            border: none;
            padding: 1.2vh 1.8vw;
            box-shadow: 0 8px 20px rgba(255, 159, 10, 0.3);
        }

        .btn-pause:hover {
            background: #ffb340;
        }

        .secondary-actions {
            display: flex;
            gap: 0.6vw;
        }

        .btn-all-bonus {
            background: rgba(10, 132, 255, 0.14);
            border: 1px solid rgba(10, 132, 255, 0.35);
            color: #64D2FF;
            font-size: 1.45vh;
            padding: 0.75vh 1.1vw;
            border-radius: 1.1vh;
        }

        .btn-all-bonus:hover {
            background: rgba(10, 132, 255, 0.25);
        }

        .btn-danger-ghost {
            background: rgba(255, 69, 58, 0.1);
            border: 1px solid rgba(255, 69, 58, 0.25);
            color: #FF6961;
            font-size: 1.45vh;
            padding: 0.75vh 1vw;
            border-radius: 1.1vh;
        }

        .btn-danger-ghost:hover {
            background: rgba(255, 69, 58, 0.22);
        }

        /* TEAMS GRID */
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.2vw;
            height: 100%;
        }

        .team-card {
            background: var(--surface-glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--border-subtle);
            border-radius: 3.2vh;
            padding: 2.8vh 2vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: border-color 0.3s ease;
        }

        /* Top Subtle Glow Line per Team */
        .team-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 3px;
            border-radius: 0 0 4px 4px;
            opacity: 0.9;
        }

        .team-1::before { background: var(--accent-amber); box-shadow: 0 2px 20px var(--accent-amber); }
        .team-2::before { background: var(--accent-pink); box-shadow: 0 2px 20px var(--accent-pink); }
        .team-3::before { background: var(--accent-blue); box-shadow: 0 2px 20px var(--accent-blue); }

        /* Team Header */
        .team-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.9vw;
            width: 100%;
        }

        .team-badge-icon {
            width: 5.2vh;
            height: 5.2vh;
            border-radius: 1.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .team-1 .team-badge-icon { background: rgba(255, 159, 10, 0.15); color: var(--accent-amber); }
        .team-2 .team-badge-icon { background: rgba(255, 55, 95, 0.15); color: var(--accent-pink); }
        .team-3 .team-badge-icon { background: rgba(10, 132, 255, 0.15); color: var(--accent-blue); }

        .team-badge-icon .icon-svg {
            width: 2.8vh;
            height: 2.8vh;
        }

        .team-title {
            font-size: 3.3vh;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            outline: none;
            border-bottom: 1px dashed transparent;
            padding: 0.2vh 0.4vw;
            transition: border-color 0.2s;
        }

        .team-title:focus {
            border-color: var(--text-secondary);
        }

        /* Giant Score Display */
        .score-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 0.5vh 0;
        }

        .score-display {
            font-size: 21vh; /* Enlarged as requested */
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            line-height: 0.95;
            cursor: pointer;
            padding: 1.5vh 3.2vw;
            border-radius: 3vh;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s ease;
            text-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            user-select: none;
        }

        .score-display:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-highlight);
            transform: scale(1.025);
        }

        .score-display:active {
            transform: scale(0.96);
        }

        .score-stepper {
            display: flex;
            align-items: center;
            gap: 1vw;
            margin-top: 1.8vh;
        }

        .btn-stepper {
            width: 5.8vw;
            height: 5.2vh;
            border-radius: 1.5vh;
            border: 1px solid var(--border-subtle);
            background: var(--surface-elevated);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .btn-stepper .icon-svg {
            width: 2.5vh;
            height: 2.5vh;
            stroke-width: 2.4;
        }

        .btn-stepper.plus:hover {
            background: rgba(48, 209, 88, 0.22);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .btn-stepper.minus:hover {
            background: rgba(255, 69, 58, 0.2);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .btn-stepper:active {
            transform: scale(0.94);
        }

        /* Lifelines (Көмек түрлері) */
        .lifelines-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.1vh;
            padding-top: 1.6vh;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .lifelines-label {
            font-size: 1.3vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text-secondary);
            text-align: center;
        }

        .lifelines-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8vw;
        }

        .btn-lifeline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 1.3vh 0.8vw;
            border-radius: 1.6vh;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55vw;
            font-size: 1.65vh;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-lifeline:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--border-highlight);
            transform: translateY(-1px);
        }

        .btn-lifeline.used {
            opacity: 0.28;
            background: rgba(0, 0, 0, 0.35);
            border-color: transparent;
            text-decoration: line-through;
            transform: none;
        }

        /* Apple-style Notification Banner */
        .apple-toast {
            position: fixed;
            bottom: 3.5vh;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            background: rgba(44, 44, 46, 0.88);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.8vh 2.8vw;
            border-radius: 999px;
            font-size: 2.3vh;
            font-weight: 600;
            color: var(--text-primary);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            gap: 0.8vw;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 999;
        }

        .apple-toast.visible {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="stage-16-9">
    <!-- TOP BAR -->
    <header class="top-bar">
        <!-- Time Configuration -->
        <div class="time-Controls-group">
            <div class="section-caption">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>Уақытты баптау</span>
            </div>
            <div class="segmented-presets">
                <button class="preset-pill" onclick="setTimer(30, this)">30 сек</button>
                <button class="preset-pill active" onclick="setTimer(60, this)">1 мин</button>
                <button class="preset-pill" onclick="setTimer(120, this)">2 мин</button>
                <button class="preset-pill" onclick="setTimer(180, this)">3 мин</button>
            </div>
            <div class="custom-time-row">
                <input type="number" id="customMin" class="apple-input" placeholder="Мин" min="0" max="99">
                <input type="number" id="customSec" class="apple-input" placeholder="Сек" min="0" max="59">
                <button class="btn-glass-sm" onclick="setCustomTimer()">Орнату</button>
            </div>
        </div>

        <!-- Master Timer Readout -->
        <div class="timer-center">
            <div id="timerDisplay" class="timer-readout">01:00</div>
        </div>

        <!-- Master Controls -->
        <div class="right-controls-group">
            <div class="primary-transport">
                <button id="startPauseBtn" class="btn-apple btn-play" onclick="toggleTimer()">
                    <svg id="playPauseIcon" class="icon-svg" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;">
                        <polygon points="6 4 20 12 6 20 6 4"/>
                    </svg>
                    <span id="playPauseText">БАСТАУ</span>
                </button>
                <button class="btn-apple" onclick="resetTimer()" title="Уақытты қайтару">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <polyline points="3 3 3 8 8 8"/>
                    </svg>
                    <span>Қайтару</span>
                </button>
                <button id="soundToggleBtn" class="btn-apple btn-icon-only" onclick="toggleMute()" title="Дыбысты қосу/өшіру">
                    <svg id="soundIcon" class="icon-svg" viewBox="0 0 24 24">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                </button>
                <button class="btn-apple btn-icon-only" onclick="toggleFullScreen()" title="Толық экран">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    </svg>
                </button>
            </div>
            <div class="secondary-actions">
                <button class="btn-apple btn-all-bonus" onclick="addAllScores(1)">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <span>Барлық топқа +1 ұпай</span>
                </button>
                <button class="btn-apple btn-danger-ghost" onclick="resetAllGame()">
                    <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    <span>Ойынды жаңарту</span>
                </button>
            </div>
        </div>
    </header>

    <!-- TEAMS SCOREBOARD -->
    <main class="teams-grid">
        <!-- Team 1: Зиёкорлар -->
        <section class="team-card team-1">
            <div class="team-header">
                <div class="team-badge-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                </div>
                <h2 class="team-title" contenteditable="true" spellcheck="false">Зиёкорлар</h2>
            </div>

            <div class="score-center">
                <div id="score-1" class="score-display" onclick="changeScore(1, 1)" title="+1 ұпай қосу үшін басыңыз">0</div>
                <div class="score-stepper">
                    <button class="btn-stepper minus" onclick="changeScore(1, -1)" title="-1 ұпай">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="btn-stepper plus" onclick="changeScore(1, 1)" title="+1 ұпай">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
            </div>

            <div class="lifelines-area">
                <div class="lifelines-label">Команда көмегі</div>
                <div class="lifelines-grid">
                    <button id="time-btn-1" class="btn-lifeline" onclick="useExtraTime(1)">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <circle cx="12" cy="13" r="8"/>
                            <path d="M12 9v4l2 2"/>
                            <path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M12 2v3"/>
                        </svg>
                        <span>+1 минут</span>
                    </button>
                    <button id="aud-btn-1" class="btn-lifeline" onclick="useAudienceHelp(1)">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span>Зал көмегі</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Team 2: Дўстлар -->
        <section class="team-card team-2">
            <div class="team-header">
                <div class="team-badge-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                </div>
                <h2 class="team-title" contenteditable="true" spellcheck="false">Дўстлар</h2>
            </div>

            <div class="score-center">
                <div id="score-2" class="score-display" onclick="changeScore(2, 1)" title="+1 ұпай қосу үшін басыңыз">0</div>
                <div class="score-stepper">
                    <button class="btn-stepper minus" onclick="changeScore(2, -1)" title="-1 ұпай">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="btn-stepper plus" onclick="changeScore(2, 1)" title="+1 ұпай">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
            </div>

            <div class="lifelines-area">
                <div class="lifelines-label">Команда көмегі</div>
                <div class="lifelines-grid">
                    <button id="time-btn-2" class="btn-lifeline" onclick="useExtraTime(2)">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <circle cx="12" cy="13" r="8"/>
                            <path d="M12 9v4l2 2"/>
                            <path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M12 2v3"/>
                        </svg>
                        <span>+1 минут</span>
                    </button>
                    <button id="aud-btn-2" class="btn-lifeline" onclick="useAudienceHelp(2)">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span>Зал көмегі</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Team 3: Фикр етакчилари -->
        <section class="team-card team-3">
            <div class="team-header">
                <div class="team-badge-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
                        <path d="M9 18h6"/>
                        <path d="M10 22h4"/>
                    </svg>
                </div>
                <h2 class="team-title" contenteditable="true" spellcheck="false">Фикр етакчилари</h2>
            </div>

            <div class="score-center">
                <div id="score-3" class="score-display" onclick="changeScore(3, 1)" title="+1 ұпай қосу үшін басыңыз">0</div>
                <div class="score-stepper">
                    <button class="btn-stepper minus" onclick="changeScore(3, -1)" title="-1 ұпай">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="btn-stepper plus" onclick="changeScore(3, 1)" title="+1 ұпай">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
            </div>

            <div class="lifelines-area">
                <div class="lifelines-label">Команда көмегі</div>
                <div class="lifelines-grid">
                    <button id="time-btn-3" class="btn-lifeline" onclick="useExtraTime(3)">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <circle cx="12" cy="13" r="8"/>
                            <path d="M12 9v4l2 2"/>
                            <path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M12 2v3"/>
                        </svg>
                        <span>+1 минут</span>
                    </button>
                    <button id="aud-btn-3" class="btn-lifeline" onclick="useAudienceHelp(3)">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span>Зал көмегі</span>
                    </button>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- Apple Pill Notification -->
<div id="appleToast" class="apple-toast">
    <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span id="toastText">Хабарлама</span>
</div>

<script>
    let scores = { 1: 0, 2: 0, 3: 0 };
    let defaultTime = 60;
    let currentTime = 60;
    let timerInterval = null;
    let isRunning = false;
    let isMuted = false;

    // Web Audio API Synthesizer for Apple-like UI & Timer Sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function ensureAudio() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type = 'sine', duration = 0.12, volume = 0.15, delay = 0) {
        if (isMuted) return;
        ensureAudio();
        setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }, delay);
    }

    // Sound Effects
    function sfxTick(urgent = false) {
        if (urgent) {
            playTone(880, 'sine', 0.09, 0.22);
            playTone(1760, 'triangle', 0.05, 0.08);
        } else {
            playTone(1200, 'sine', 0.035, 0.05);
        }
    }

    function sfxTimeUp() {
        playTone(523.25, 'sawtooth', 0.25, 0.2, 0);
        playTone(392.00, 'sawtooth', 0.25, 0.2, 220);
        playTone(261.63, 'sawtooth', 0.65, 0.25, 440);
    }

    function sfxScoreUp() {
        playTone(587.33, 'sine', 0.14, 0.16, 0);
        playTone(880.00, 'sine', 0.22, 0.18, 70);
    }

    function sfxScoreDown() {
        playTone(320, 'triangle', 0.15, 0.14, 0);
    }

    function sfxLifeline() {
        playTone(523.25, 'sine', 0.15, 0.18, 0);
        playTone(659.25, 'sine', 0.15, 0.18, 90);
        playTone(1046.50, 'sine', 0.35, 0.2, 180);
    }

    function toggleMute() {
        isMuted = !isMuted;
        const icon = document.getElementById('soundIcon');
        if (isMuted) {
            icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
            showToast('Дыбыс өшірілді');
        } else {
            icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
            sfxScoreUp();
            showToast('Дыбыс қосылды');
        }
    }

    function getTeamName(teamId) {
        const card = document.querySelector(`.team-${teamId} .team-title`);
        return card ? card.textContent.trim() : `Топ ${teamId}`;
    }

    function changeScore(team, delta) {
        scores[team] = Math.max(0, scores[team] + delta);
        const el = document.getElementById(`score-${team}`);
        el.textContent = scores[team];

        el.style.transform = 'scale(1.09)';
        setTimeout(() => el.style.transform = '', 160);

        if (delta > 0) sfxScoreUp();
        else sfxScoreDown();
    }

    function addAllScores(delta) {
        [1, 2, 3].forEach(id => {
            scores[id] = Math.max(0, scores[id] + delta);
            const el = document.getElementById(`score-${id}`);
            el.textContent = scores[id];
            el.style.transform = 'scale(1.09)';
            setTimeout(() => el.style.transform = '', 160);
        });
        sfxLifeline();
        showToast('Барлық топқа +1 ұпай қосылды');
    }

    function updateTimerDisplay() {
        const mins = Math.floor(currentTime / 60).toString().padStart(2, '0');
        const secs = (currentTime % 60).toString().padStart(2, '0');
        const display = document.getElementById('timerDisplay');
        display.textContent = `${mins}:${secs}`;

        display.classList.remove('warning', 'danger');
        if (currentTime <= 10 && currentTime > 0) {
            display.classList.add('danger');
        } else if (currentTime <= 20 && currentTime > 0) {
            display.classList.add('warning');
        }
    }

    function setTimer(seconds, btnEl = null) {
        pauseTimer();
        defaultTime = seconds;
        currentTime = seconds;
        updateTimerDisplay();

        if (btnEl) {
            document.querySelectorAll('.preset-pill').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
        }
        playTone(600, 'sine', 0.08, 0.1);
    }

    function setCustomTimer() {
        const mins = parseInt(document.getElementById('customMin').value) || 0;
        const secs = parseInt(document.getElementById('customSec').value) || 0;
        const total = (mins * 60) + secs;
        if (total > 0) {
            document.querySelectorAll('.preset-pill').forEach(b => b.classList.remove('active'));
            setTimer(total);
            showToast(`Уақыт орнатылды: ${mins} мин ${secs} сек`);
        }
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        if (currentTime <= 0) return;
        ensureAudio();
        isRunning = true;

        const btn = document.getElementById('startPauseBtn');
        const icon = document.getElementById('playPauseIcon');
        const text = document.getElementById('playPauseText');

        btn.className = 'btn-apple btn-pause';
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        text.textContent = 'КІДІРТУ';

        playTone(740, 'sine', 0.12, 0.15);

        timerInterval = setInterval(() => {
            currentTime--;
            updateTimerDisplay();

            if (currentTime > 0) {
                sfxTick(currentTime <= 10);
            } else if (currentTime <= 0) {
                pauseTimer();
                sfxTimeUp();
                showToast('Уақыт аяқталды!');
            }
        }, 1000);
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(timerInterval);

        const btn = document.getElementById('startPauseBtn');
        const icon = document.getElementById('playPauseIcon');
        const text = document.getElementById('playPauseText');

        btn.className = 'btn-apple btn-play';
        icon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
        text.textContent = 'БАСТАУ';
    }

    function resetTimer() {
        pauseTimer();
        currentTime = defaultTime;
        updateTimerDisplay();
        playTone(440, 'sine', 0.1, 0.1);
    }

    function useExtraTime(teamId) {
        const btn = document.getElementById(`time-btn-${teamId}`);
        if (btn.classList.contains('used')) {
            btn.classList.remove('used');
            return;
        }
        btn.classList.add('used');
        currentTime += 60;
        updateTimerDisplay();
        sfxLifeline();
        showToast(`«${getTeamName(teamId)}» тобы +1 минут қосымша уақыт алды`);
    }

    function useAudienceHelp(teamId) {
        const btn = document.getElementById(`aud-btn-${teamId}`);
        if (btn.classList.contains('used')) {
            btn.classList.remove('used');
            return;
        }
        btn.classList.add('used');
        sfxLifeline();
        showToast(`«${getTeamName(teamId)}» тобы ЗАЛ КӨМЕГІН таңдады`);
    }

    let toastTimer;
    function showToast(msg) {
        const toast = document.getElementById('appleToast');
        document.getElementById('toastText').textContent = msg;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('visible');
        }, 3400);
    }

    function resetAllGame() {
        if (confirm('Барлық ұпайлар мен көмектерді бастапқы қалпына келтіруді растайсыз ба?')) {
            resetTimer();
            [1, 2, 3].forEach(id => {
                scores[id] = 0;
                document.getElementById(`score-${id}`).textContent = '0';
                document.getElementById(`time-btn-${id}`).classList.remove('used');
                document.getElementById(`aud-btn-${id}`).classList.remove('used');
            });
            showToast('Ойын толығымен жаңартылды');
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
</script>

</body>
</html>
